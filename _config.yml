# _config.yml

title: PeriodWise
description: Understand your cycle. Understand your body.
url: "https://periodwise.online"
baseurl: ""

author:
  name: PeriodWise

remote_theme: daattali/beautiful-jekyll

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# 👇 This is what actually works — applies footer-extra to every page
defaults:
  - scope:
      path: ""
    values:
      footer-extra: periodwise-footer.html

navbar-links:
  Home: "home"
  Cycle & Fertility: "cycle-fertility"
  Blog: "blog"
  Shop: "shop"
  PeriodWise App: "https://app.periodwise.online"
  About: "about"
  Privacy Policy: "privacy-policy"
  Terms & Conditions: "terms"
  Contact: "contact"

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
timezone: United States/New York

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
